<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AccessEvent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <nav aria-label="Главное меню">
      <a href="/" class="nav-link">Главная</a>
      <a href="/events-view" class="nav-link">Мероприятия</a>
      <a href="/dashboard" class="nav-link">Личный кабинет</a>
      <a href="/login" class="nav-link">Вход</a>
      <a href="/register" class="nav-link">Регистрация</a>
    </nav>
  </header>
  <main id="main" role="main" style="padding: 20px; max-width: 900px; margin: 0 auto;">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>AccessEvent — платформа инклюзивных мероприятий</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
