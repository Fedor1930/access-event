{% extends "base.html" %}
{% block title %}Вход — AccessEvent{% endblock %}
{% block content %}
  <div class="form-container" style="margin-top: 40px; max-width: 400px; margin-left: auto; margin-right: auto;">
    <h1>Вход в систему</h1>
    
    {% if error %}
      <div style="background-color: #fce8e6; color: #c5221f; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-weight: 500;">
        {{ error }}
      </div>
    {% endif %}

    <!-- autocomplete="off" блокирует принудительную вставку старого организатора -->
    <form method="POST" autocomplete="off">
      <div class="form-group" style="margin-bottom: 15px;">
        <label for="username" style="display:block; margin-bottom: 5px; font-weight: 600;">Email или логин</label>
        <input type="text" id="username" name="username" required autocomplete="off" style="width:100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <label for="password" style="display:block; margin-bottom: 5px; font-weight: 600;">Пароль</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" style="width:100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer;">Войти</button>
    </form>
  </div>

  {% if token %}
  <script>
    localStorage.setItem('token', '{{ token }}');
    window.location.href = '/dashboard';
  </script>
  {% endif %}
{% endblock %}
