{% extends "base.html" %}
 
{% block title %}Вход — AccessEvent{% endblock %}
 
{% block content %}
<div class="form-container">
    <h1>Вход</h1>
 
    {% if error %}
        <div class="notification notification-error" role="alert" style="position: relative; margin-bottom: 1rem; top: 0; right: 0;">
            {{ error }}
        </div>
    {% endif %}

    <form id="login-form" method="POST"
          action="{{ url_for('login_page') }}"
          aria-label="Форма входа">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   aria-describedby="email-hint" required>
            <small id="email-hint">Введите email, использованный при регистрации</small>
        </div>
 
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password"
                   aria-describedby="password-hint" required>
            <small id="password-hint">Минимум 8 символов</small>
        </div>
 
        <button type="submit" class="btn btn-primary">
            Войти
        </button>
    </form>
 
    <p style="margin-top: 1rem;">Нет аккаунта?
       <a href="{{ url_for('register_page') }}">Зарегистрируйтесь</a>
    </p>
</div>
{% endblock %}
 
{% block scripts %}
<script>
    document.getElementById('login-form').addEventListener('submit',
        function(e) {
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            if (!email.value.trim() || !password.value.trim()) {
                e.preventDefault();
                showNotification('Заполните email и пароль', 'error');
            }
        }
    );
</script>
{% endblock %}
